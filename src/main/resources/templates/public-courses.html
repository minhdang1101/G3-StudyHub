<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        body {
            background:
                    radial-gradient(circle at top left, rgba(79, 70, 229, 0.10), transparent 28%),
                    radial-gradient(circle at top right, rgba(6, 182, 212, 0.10), transparent 22%),
                    var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            max-width: 1180px;
            margin: 28px auto;
            padding: 0 16px;
        }

        .top {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .course-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            height: 100%;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.10);
        }

        .course-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #eef2ff;
        }

        .course-body {
            padding: 14px 14px 16px;
        }

        .course-name {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.45;
            margin-bottom: 8px;
        }

        .course-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            min-height: 42px;
            margin-bottom: 12px;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .course-price {
            font-weight: 900;
            color: var(--primary);
        }

        .empty-state {
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            background: #f8fafc;
            text-align: center;
            padding: 36px 18px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-collection-play" style="color: var(--primary); font-size: 20px;"></i>
            <h1 class="title mb-0">Tất cả khóa học</h1>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/home}">
            <i class="bi bi-arrow-left"></i> Về trang chủ
        </a>
    </div>

    <div class="mt-4">
        <div class="row g-4" th:if="${!#lists.isEmpty(courses)}">
            <div class="col-xl-3 col-lg-4 col-md-6 col-12" th:each="course : ${courses}">
                <div class="course-card">
                    <img class="course-thumb"
                         th:src="${course.thumbnailUrl != null and !#strings.isEmpty(course.thumbnailUrl) ? course.thumbnailUrl : 'https://via.placeholder.com/600x340?text=Course'}"
                         alt="course thumbnail">
                    <div class="course-body">
                        <div class="course-name" th:text="${course.title}">Course Title</div>
                        <div class="course-desc"
                             th:text="${course.description != null and course.description.length() > 90 ? #strings.substring(course.description, 0, 90) + '...' : course.description}">
                            Description
                        </div>
                        <div class="course-meta">
                            <div class="course-price" th:text="${course.price} + ' VND'">0 VND</div>
                            <div class="text-muted small">
                                <i class="bi bi-star-fill" style="color:#f59e0b;"></i> 4.8
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(courses)}" class="empty-state">
            <i class="bi bi-journal-x" style="font-size: 34px; color:#94a3b8;"></i>
            <div class="fw-semibold mb-1">Chưa có khóa học nào</div>
            <div>Hiện tại chưa có khóa học được xuất bản.</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
