<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Register</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f3f3;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:#e5e5e5;
            padding:30px;
            border-radius:8px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:5px;
            border:1px solid #999;
            border-radius:4px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:#dcdcdc;
            border:1px solid #999;
            border-radius:4px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#c9c9c9;
        }

        .login-link{
            text-align:center;
            margin-top:10px;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>User Register</h2>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/users/register}" method="post" th:object="${userDto}">

        <label>Full Name*</label>
        <input type="text" th:field="*{fullName}" required>

        <label>Email*</label>
        <input type="email" th:field="*{email}" required>

        <label>Password*</label>
        <input type="password" th:field="*{password}" required>

        <label>Password Confirm*</label>
        <input type="password" th:field="*{confirmPassword}" required>

        <button type="submit">Register</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login here</a>
    </div>

</div>

</body>
</html>
