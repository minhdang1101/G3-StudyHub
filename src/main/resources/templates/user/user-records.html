<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .section-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
            margin-bottom: 20px;
        }

        .info-row {
            background-color: #f8f9fa;
            padding: 10px 15px;
            margin-bottom: 5px;
            border-left: 4px solid #007bff;
            font-size: 0.95rem;
        }

        .info-row strong {
            margin-right: 5px;
        }

        .info-row:nth-child(even) {
            background-color: #ffffff;
        }

        .item-card {
            background-color: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #28a745;
        }

        .item-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }

        .item-meta {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .item-link {
            color: #6610f2;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .item-link:hover {
            text-decoration: underline;
        }

        .comment-content {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div th:replace="~{common/sidebar :: sidebar(activePage='users')}"></div>

        <!-- Main Content -->
        <div class="container-fluid p-4">

            <!-- 1. Chi tiết người dùng -->
            <h3 class="section-header">Chi tiết người dùng</h3>

            <div class="info-row">
                <strong>ID:</strong> <span th:text="${user.id}"></span>
            </div>
            <div class="info-row">
                <strong>Tên:</strong> <span th:text="${user.fullName}"></span>
            </div>
            <div class="info-row">
                <strong>Email:</strong> <span th:text="${user.email}"></span>
            </div>
            <div class="info-row">
                <strong>Ngày tạo:</strong>
                <span
                    th:text="${user.createdAt != null ? #dates.format(user.createdAt, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}"></span>
            </div>
            <div class="info-row">
                <strong>Số bài viết:</strong> <span th:text="${postCount}"></span>
            </div>
            <div class="info-row">
                <strong>Số comments:</strong> <span th:text="${commentCount}"></span>
            </div>

            <!-- 2. Bài viết của User -->
            <h3 class="section-header mt-5">
                Bài viết của <span th:text="${user.fullName}"></span> (<span th:text="${postCount}"></span>)
            </h3>

            <div th:if="${#lists.isEmpty(posts)}" class="text-muted fst-italic">Không có bài viết nào.</div>

            <div th:each="post : ${posts}" class="item-card">
                <div class="item-title" th:text="${post.title}">Title</div>
                <div class="item-meta">
                    Status: <span th:text="${post.status}"></span> |
                    Comments: <span th:text="${post.comments != null ? post.comments.size() : 0}"></span> |
                    Created: <span th:text="${#dates.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <a href="#" class="item-link">Xem chi tiết</a>
            </div>

            <!-- 3. Comments của User -->
            <h3 class="section-header mt-5">
                Comments của <span th:text="${user.fullName}"></span> (<span th:text="${commentCount}"></span>)
            </h3>

            <div th:if="${#lists.isEmpty(comments)}" class="text-muted fst-italic">Không có comment nào.</div>

            <div th:each="cmt : ${comments}" class="item-card">
                <div class="item-title comment-content" th:text="${#strings.abbreviate(cmt.comment, 50)}">Comment
                    content</div>
                <div class="item-meta">
                    On post: <span th:text="${cmt.post != null ? cmt.post.title : 'Unknown Post'}"></span>
                </div>
            </div>

            <!-- Back Button -->
            <div class="mt-4">
                <a th:href="@{/users}" class="btn btn-primary px-4">Quay lại danh sách</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
