<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>User Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .avatar-preview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ddd;
      margin-bottom: 15px;
    }

    .bg-light-gray {
      background-color: #f8f9fa;
    }

    .field-error {
      color: #dc3545;
      font-size: 0.875em;
      margin-top: 0.25rem;
    }
  </style>
</head>

<body>
  <div class="d-flex">

    <div th:replace="~{common/sidebar :: sidebar(activePage='users')}"></div>

    <div class="container-fluid p-4">
      <h3>User Details</h3>

      <div class="card p-4 bg-light-gray">

        <form th:action="@{/users/update}" method="post" th:object="${userDto}" enctype="multipart/form-data">

          <input type="hidden" th:field="*{id}" />
          <input type="hidden" th:field="*{avatar}" />

          <div class="row">
            <div class="col-md-8">

              <div class="mb-3">
                <label class="form-label fw-bold">Full Name*</label>
                <input type="text" class="form-control" th:field="*{fullName}"
                  th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Email*</label>
                <input type="email" class="form-control" th:field="*{email}"
                  th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Mobile</label>
                <input type="text" class="form-control" th:field="*{mobile}">
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Role*</label>
                <select class="form-select" th:field="*{roleId}">
                  <option th:each="r : ${roleList}" th:value="${r.id}" th:text="${r.name}">Admin</option>
                </select>
              </div>
            </div>

            <div class="col-md-4 text-center">
              <label class="form-label fw-bold d-block text-start">Avatar</label>

              <img th:src="*{avatar} != null ? @{/{path}(path=*{avatar})} : 'https://via.placeholder.com/150'"
                class="avatar-preview" alt="User Avatar">

              <input type="file" name="imageFile" class="form-control mb-3">

              <div class="text-start mt-4">
                <label class="form-label fw-bold d-block">Status</label>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" th:field="*{status}" value="Active">
                  <label class="form-check-label">Active</label>
                </div>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" th:field="*{status}" value="Blocked">
                  <label class="form-check-label">Blocked</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-12">
              <label class="form-label fw-bold">Notes</label>
              <textarea class="form-control" rows="4" th:field="*{note}"></textarea>
            </div>
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-secondary border">Submit</button>
            <a th:href="@{/users}" class="btn btn-link text-decoration-none">Back</a>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
