<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .avatar-preview{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #ddd;
            margin-bottom:15px;
        }

        .bg-light-gray{
            background:#f8f9fa;
        }

        .info-box{
            background:white;
            border:1px solid #ddd;
            border-radius:6px;
            padding:15px;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="d-flex">

    <div th:replace="~{common/sidebar :: sidebar(activePage='users')}"></div>

    <div class="container-fluid p-4">

        <h3>User Details</h3>

        <div class="card p-4 bg-light-gray">

            <form th:action="@{/users/update}"
                  method="post"
                  th:object="${userDto}"
                  enctype="multipart/form-data">

                <!-- ID -->
                <input type="hidden" th:field="*{id}">

                <!-- giữ avatar cũ -->
                <input type="hidden" th:field="*{avatarUrl}">

                <!-- upload avatar mới -->
                <div class="form-group">
                    <label>Avatar</label>
                    <input type="file" name="imageFile" class="form-control">
                </div>

                <!-- preview avatar hiện tại -->
                <div th:if="*{avatarUrl != null}">
                    <img th:src="@{${userDto.avatarUrl}}" width="120">
                </div>

                <div class="row">

                    <div class="col-md-6">

                        <!-- FULL NAME -->

                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name *</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}">
                            </div>

                        </div>

                        <!-- EMAIL -->

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email *</label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <!-- ROLE -->

                        <div class="mb-3">
                            <label class="form-label fw-bold">Role *</label>

                            <select class="form-select"
                                    th:field="*{roleId}">

                                <option value="">-- Select Role --</option>

                                <option th:each="r : ${roleList}"
                                        th:value="${r.id}"
                                        th:text="${r.name}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <!-- USERNAME -->

                        <div class="mb-3">
                            <label class="form-label fw-bold">Username *</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}">
                            </div>

                        </div>

                        <!-- STATUS -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">Status</label>

                            <div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           th:field="*{status}"
                                           th:value="'Unverified'">

                                    <label class="form-check-label">Unverified</label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           th:field="*{status}"
                                           th:value="'Active'">

                                    <label class="form-check-label">Active</label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input"
                                           type="radio"
                                           th:field="*{status}"
                                           th:value="'Inactive'">

                                    <label class="form-check-label">Inactive</label>

                                </div>

                                </div>
                            </div>
                        </div>

                        <!-- ACCOUNT INFO -->

                        <div class="info-box mt-3">

                            <div>
                                <strong>Created:</strong>
                                <span th:text="${#dates.format(userDto.createdAt,'dd-MM-yyyy HH:mm')}"></span>
                            </div>

                            <div>
                                <strong>Last Updated:</strong>
                                <span th:text="${#dates.format(userDto.lastLogin,'dd-MM-yyyy HH:mm')}"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit"
                            class="btn btn-primary">
                        Submit
                    </button>
                    <a th:href="@{/users}"
                       class="btn btn-secondary">
                        Back to Users
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
