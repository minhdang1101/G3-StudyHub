<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Xác nhận thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px;">
            <div class="card-header bg-white text-center py-4 border-bottom-0">
                <h4 class="mb-0 fw-bold text-dark">Xác nhận thanh toán</h4>
                <p class="text-muted small mb-0 mt-1">Vui lòng kiểm tra lại thông tin trước khi thanh toán</p>
            </div>

            <div class="card-body px-4 pb-4">
                <div class="bg-light rounded p-3 mb-4 border">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Mã đơn hàng:</span>
                        <strong th:text="'#' + ${enrollment.id}">#38</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Khóa học:</span>
                        <strong class="text-end" th:text="${enrollment.course.title}">Tên khóa học</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Học viên:</span>
                        <strong class="text-end"
                            th:text="${enrollment.fullName != null ? enrollment.fullName : enrollment.user.fullName}">Tên
                            người dùng</strong>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted fw-medium">Tổng tiền:</span>
                        <strong class="text-primary fs-4"
                            th:text="${#numbers.formatDecimal(enrollment.fee, 0, 'COMMA', 0, 'POINT')} + ' ₫'">5,000
                            ₫</strong>
                    </div>
                </div>

                <form th:action="@{/payment/payos/checkout}" method="post">
                    <input type="hidden" name="id" th:value="${enrollment.id}">

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-2 fw-bold">
                        Tiếp tục đến cổng thanh toán <i class="bi bi-box-arrow-up-right ms-1"></i>
                    </button>

                    <a th:href="@{/my-enrollments}" class="btn btn-light w-100 border text-muted">Quay lại</a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
