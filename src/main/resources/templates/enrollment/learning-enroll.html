<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký khóa học - StudyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #f0f2f5;
        }

        .enroll-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .enroll-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 780px;
            overflow: hidden;
        }

        .enroll-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
            padding: 2rem 2.5rem 1.75rem;
            color: #fff;
        }

        .enroll-header .badge-course {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .enroll-header h2 {
            font-size: 1.65rem;
            font-weight: 800;
            margin: 0 0 0.25rem;
            letter-spacing: -0.5px;
        }

        .enroll-header .course-meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .enroll-header .price-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(199, 210, 254, 0.35);
            border-radius: 50px;
            padding: 0.3rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #c7d2fe;
        }

        .enroll-body {
            padding: 2rem 2.5rem 2.5rem;
        }

        /* Form field styling */
        .form-label {
            font-weight: 600;
            font-size: 0.82rem;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.4rem;
        }

        .form-control,
        .form-select {
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #111827;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
            outline: none;
        }

        .form-control.is-invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-control.is-valid {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .invalid-feedback {
            font-size: 0.78rem;
            font-weight: 600;
            color: #ef4444;
            margin-top: 0.3rem;
            display: none;
        }

        .form-control.is-invalid~.invalid-feedback {
            display: block;
        }

        /* Server-side error */
        .server-error {
            font-size: 0.78rem;
            font-weight: 600;
            color: #ef4444;
            margin-top: 0.3rem;
        }

        /* Payment method */
        .payment-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.875rem;
            color: #374151;
        }

        .payment-option:has(input:checked) {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4f46e5;
        }

        .payment-option input[type="radio"] {
            accent-color: #6366f1;
            width: 16px;
            height: 16px;
        }

        .payment-option .pay-icon {
            font-size: 1.1rem;
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #6b7280;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
            margin-bottom: 1.25rem;
        }

        .btn-back:hover {
            color: #4f46e5;
        }

        .divider {
            border: none;
            border-top: 1px solid #f0f2f5;
            margin: 1.25rem 0;
        }

        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 1rem;
        }

        .char-counter {
            font-size: 0.72rem;
            color: #9ca3af;
            text-align: right;
            margin-top: 3px;
        }

        .char-counter.warn {
            color: #f59e0b;
            font-weight: 600;
        }

        .char-counter.over {
            color: #ef4444;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="enroll-wrapper">
        <div class="enroll-card">

            <!-- Header -->
            <div class="enroll-header">
                <div class="badge-course">
                    <i class="bi bi-mortarboard-fill"></i> Course Enrollment
                </div>
                <h2 th:text="${course.title}">Course Name</h2>
                <div class="d-flex align-items-center gap-3 mt-2">
                    <span class="course-meta"
                        th:text="${course.category != null ? course.category.name : 'General'}">Category</span>
                    <span class="price-chip">
                        <i class="bi bi-tag-fill"></i>
                        <span
                            th:text="${course.price > 0 ? #numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'Miễn phí'}">0
                            ₫</span>
                    </span>
                </div>
            </div>

            <!-- Body -->
            <div class="enroll-body">
                <a th:href="@{/courses}" class="btn-back">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách khóa học
                </a>

                <!-- Server-side already-enrolled alert (fallback) -->
                <div th:if="${alreadyEnrolled}" class="alert alert-warning d-flex align-items-center gap-2 mb-3"
                    style="border-radius:12px; border:none; font-size:0.875rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Bạn đã đăng ký khóa học này rồi!
                </div>

                <form id="enrollForm" th:action="@{/enroll/submit}" method="post" th:object="${enrollment}" novalidate>
                    <input type="hidden" name="courseId" th:value="${course.courseId}">

                    <!-- Personal Info -->
                    <p class="section-title">Thông tin học viên</p>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ và tên *</label>
                            <input type="text" id="fullName" class="form-control" th:field="*{user.fullName}"
                                placeholder="Nhập họ và tên đầy đủ" minlength="2" maxlength="100">
                            <div class="invalid-feedback" id="fullName-err"></div>
                            <div class="char-counter" id="fullName-count"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" id="email" class="form-control" th:field="*{user.email}"
                                placeholder="example@email.com" maxlength="150">
                            <div class="invalid-feedback" id="email-err"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại *</label>
                            <input type="text" id="mobile" class="form-control" th:field="*{user.mobile}"
                                placeholder="0987 654 321" minlength="9" maxlength="15">
                            <div class="invalid-feedback" id="mobile-err"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phương thức thanh toán</label>
                            <div class="d-flex gap-2 flex-wrap mt-1">
                                <label class="payment-option flex-fill">
                                    <input type="radio" th:field="*{paymentMethod}" value="Bank Transfer">
                                    <i class="bi bi-bank pay-icon"></i> Bank Transfer
                                </label>
                                <label class="payment-option flex-fill">
                                    <input type="radio" th:field="*{paymentMethod}" value="VNPAY">
                                    <i class="bi bi-wallet2 pay-icon"></i> VNPAY
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="divider">

                    <!-- Note -->
                    <div class="mb-4">
                        <label class="form-label">Ghi chú đăng ký <span class="text-muted fw-normal">(tùy
                                chọn)</span></label>
                        <textarea id="enrollReason" class="form-control" th:field="*{enrollReason}" rows="3"
                            placeholder="Lý do đăng ký, mong đợi từ khóa học..." maxlength="500"></textarea>
                        <div class="char-counter" id="note-count">0 / 500</div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="bi bi-send-fill me-2"></i>Xác nhận đăng ký
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── Helper functions ──────────────────────────────────────────────
        function setValid(el) {
            el.classList.remove('is-invalid');
            el.classList.add('is-valid');
        }

        function setInvalid(el, errId, msg) {
            el.classList.remove('is-valid');
            el.classList.add('is-invalid');
            const errEl = document.getElementById(errId);
            if (errEl) errEl.textContent = msg;
            return false;
        }

        function clearState(el) {
            el.classList.remove('is-invalid', 'is-valid');
        }

        // ── Character counter ─────────────────────────────────────────────
        function updateCounter(inputEl, counterId, max) {
            const len = inputEl.value.length;
            const counter = document.getElementById(counterId);
            if (!counter) return;
            counter.textContent = len + ' / ' + max;
            counter.className = 'char-counter';
            if (len >= max) counter.classList.add('over');
            else if (len >= max * 0.85) counter.classList.add('warn');
        }

        // ── Field: Full Name ──────────────────────────────────────────────
        const fullNameEl = document.getElementById('fullName');
        fullNameEl.addEventListener('input', () => {
            updateCounter(fullNameEl, 'fullName-count', 100);
            validateFullName();
        });
        fullNameEl.addEventListener('blur', validateFullName);

        function validateFullName() {
            const v = fullNameEl.value.trim();
            if (v === '') return setInvalid(fullNameEl, 'fullName-err', 'Họ và tên không được để trống.');
            if (v.length < 2) return setInvalid(fullNameEl, 'fullName-err', 'Họ và tên phải có ít nhất 2 ký tự.');
            if (v.length > 100) return setInvalid(fullNameEl, 'fullName-err', 'Họ và tên không được vượt quá 100 ký tự.');
            setValid(fullNameEl); return true;
        }

        // ── Field: Email ──────────────────────────────────────────────────
        const emailEl = document.getElementById('email');
        emailEl.addEventListener('input', validateEmail);
        emailEl.addEventListener('blur', validateEmail);

        function validateEmail() {
            const v = emailEl.value.trim();
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (v === '') return setInvalid(emailEl, 'email-err', 'Email không được để trống.');
            if (!re.test(v)) return setInvalid(emailEl, 'email-err', 'Email không đúng định dạng (vd: abc@email.com).');
            if (v.length > 150) return setInvalid(emailEl, 'email-err', 'Email không được vượt quá 150 ký tự.');
            setValid(emailEl); return true;
        }

        // ── Field: Mobile ─────────────────────────────────────────────────
        const mobileEl = document.getElementById('mobile');
        mobileEl.addEventListener('input', validateMobile);
        mobileEl.addEventListener('blur', validateMobile);

        function validateMobile() {
            const v = mobileEl.value.trim();
            const re = /^[0-9+\s\-()]{9,15}$/;
            if (v === '') return setInvalid(mobileEl, 'mobile-err', 'Số điện thoại không được để trống.');
            if (!re.test(v)) return setInvalid(mobileEl, 'mobile-err', 'Số điện thoại không hợp lệ (9–15 chữ số).');
            setValid(mobileEl); return true;
        }

        // ── Textarea: Note ────────────────────────────────────────────────
        const noteEl = document.getElementById('enrollReason');
        noteEl.addEventListener('input', () => updateCounter(noteEl, 'note-count', 500));
        updateCounter(noteEl, 'note-count', 500); // init

        // ── Form submit ───────────────────────────────────────────────────
        document.getElementById('enrollForm').addEventListener('submit', function (e) {
            const v1 = validateFullName();
            const v2 = validateEmail();
            const v3 = validateMobile();

            if (!v1 || !v2 || !v3) {
                e.preventDefault();
                // scroll to first error
                const first = document.querySelector('.is-invalid');
                if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });

        // Init counter for fullName if prefilled
        updateCounter(fullNameEl, 'fullName-count', 100);
    </script>
</body>

</html>
