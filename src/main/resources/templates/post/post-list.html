<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Post List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .table-header {
            background-color: #28a745;
            color: white;
        }

        .badge-published {
            background-color: #28a745;
        }

        .badge-draft {
            background-color: #6c757d;
        }

        .badge-archived {
            background-color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div th:replace="~{common/sidebar :: sidebar(activePage='posts')}"></div>

        <!-- Main Content -->
        <div class="container-fluid p-4">

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card p-3 mb-3 border-secondary">
                <h4 class="mb-3">Post List</h4>

                <form th:action="@{/posts}" method="get" class="row g-2 align-items-center">

                    <div class="col-auto">
                        <select name="authorId" class="form-select">
                            <option value="">All Authors</option>
                            <option th:each="u : ${authors}" th:value="${u.id}" th:text="${u.fullName}"
                                th:selected="${u.id == authorId}"></option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <select name="status" class="form-select">
                            <option value="">All Statuses</option>
                            <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">PUBLISHED</option>
                            <option value="DRAFT" th:selected="${status == 'DRAFT'}">DRAFT</option>
                            <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">ARCHIVED</option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <input type="text" name="keyword" class="form-control" placeholder="Type post title to search"
                            th:value="${keyword}" style="width: 250px;">
                    </div>

                    <div class="col-auto">
                        <button type="submit" class="btn btn-light border">Search</button>
                    </div>

                    <div class="col text-end">
                        <a th:href="@{/posts/new}" class="btn btn-light border">New Post</a>
                    </div>
                </form>

                <table class="table table-hover align-middle mt-3">
                    <thead class="table-header">
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề</th>
                            <th>Tác giả</th>
                            <th>Trạng thái</th>
                            <th>Comments</th>
                            <th>Ngày tạo</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(posts)}">
                            <td colspan="7" class="text-center text-muted">No posts found</td>
                        </tr>
                        <tr th:each="p : ${posts}">
                            <td th:text="${p.id}">1</td>
                            <td class="fw-bold" th:text="${p.title}">Title</td>
                            <td th:text="${p.author != null ? p.author.fullName : 'Unknown'}">John Doe</td>
                            <td>
                                <span th:if="${p.status == 'PUBLISHED'}" class="badge badge-published">PUBLISHED</span>
                                <span th:if="${p.status == 'DRAFT'}" class="badge badge-draft">DRAFT</span>
                                <span th:if="${p.status == 'ARCHIVED'}" class="badge badge-archived">ARCHIVED</span>
                            </td>
                            <td th:text="${p.comments != null ? p.comments.size() : 0}">0</td>
                            <td th:text="${p.createdAt != null ? #dates.format(p.createdAt, 'dd/MM/yyyy') : 'N/A'}">
                                01/01/2024</td>
                            <td>
                                <a th:href="@{/posts/view/{id}(id=${p.id})}"
                                    class="text-primary text-decoration-none">Xem</a> |
                                <a th:href="@{/posts/edit/{id}(id=${p.id})}"
                                    class="text-primary text-decoration-none">Sửa</a> |
                                <a th:href="@{/posts/delete/{id}(id=${p.id})}" class="text-primary text-decoration-none"
                                    onclick="return confirm('Confirm delete?')">Xóa</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
