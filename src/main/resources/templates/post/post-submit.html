<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${postDto.id == null ? 'New Post' : 'Edit Post'}">Post Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div th:replace="~{common/sidebar :: sidebar(activePage='posts')}"></div>

        <!-- Main Content -->
        <div class="container-fluid p-4">

            <!-- HEADER -->
            <h3 class="mb-1 text-primary">Post Submit</h3>
            <p class="text-muted mb-4">Thêm mới (tiêu đề: thêm mới bài viết) hoặc sửa 1 bài viết đang có (tiêu đề: Cập
                nhật bài viết)</p>

            <div class="card border-primary">
                <div class="card-header bg-white border-bottom-0 pt-3">
                    <h4 class="fw-bold" th:text="${postDto.id == null ? 'Thêm bài viết mới' : 'Cập nhật bài viết'}">Form
                        Title</h4>
                    <hr class="mt-2 text-success" style="height: 3px; opacity: 1;">
                </div>
                <div class="card-body">
                    <form th:action="@{/posts/save}" method="post" th:object="${postDto}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề:</label>
                            <input type="text" class="form-control" th:field="*{title}"
                                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nội dung:</label>
                            <textarea class="form-control" rows="5" th:field="*{content}"
                                th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                                th:errors="*{content}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tác giả:</label>
                            <select class="form-select" th:field="*{authorId}"
                                th:classappend="${#fields.hasErrors('authorId')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn tác giả --</option>
                                <option th:each="u : ${authors}" th:value="${u.id}" th:text="${u.fullName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('authorId')}"
                                th:errors="*{authorId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Trạng thái:</label>
                            <select class="form-select" th:field="*{status}"
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                                <option value="DRAFT">DRAFT</option>
                                <option value="PUBLISHED">PUBLISHED</option>
                                <option value="ARCHIVED">ARCHIVED</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success px-4 me-2">Lưu</button>
                            <a th:href="@{/posts}" class="btn btn-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
