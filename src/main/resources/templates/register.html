<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - StudyHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
      }

      .register-container {
        width: 100%;
        max-width: 480px;
      }

      .register-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .register-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .register-header h2 {
        margin: 0;
        font-weight: 700;
        font-size: 2rem;
      }

      .register-header p {
        margin: 10px 0 0 0;
        opacity: 0.9;
      }

      .register-body {
        padding: 40px 30px;
      }

      .form-floating {
        margin-bottom: 20px;
      }

      .form-floating .form-control {
        border-radius: 12px;
        border: 2px solid #e9ecef;
        height: 56px;
      }

      .form-floating .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      .form-floating label {
        padding-left: 15px;
      }

      .btn-register {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 1.1rem;
        font-weight: 600;
        width: 100%;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .divider {
        text-align: center;
        margin: 25px 0;
        position: relative;
      }

      .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #e9ecef;
      }

      .divider span {
        background: white;
        padding: 0 15px;
        position: relative;
        color: #6c757d;
        font-size: 0.9rem;
      }

      .login-link {
        text-align: center;
      }

      .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
      }

      .login-link a:hover {
        color: #764ba2;
        text-decoration: underline;
      }

      .alert {
        border-radius: 12px;
        border: none;
      }

      .brand-logo {
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .password-strength {
        height: 4px;
        background: #e9ecef;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0;
        transition: all 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="register-header">
          <div class="brand-logo"><i class="bi bi-person-plus"></i></div>
          <h2>Create Account</h2>
          <p>Join our learning community today</p>
        </div>

        <div class="register-body">
          <!-- Error Message -->
          <div
            th:if="${error}"
            class="alert alert-danger d-flex align-items-center"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Error message</span>
          </div>

          <form
            th:action="@{/register}"
            th:object="${registerDTO}"
            method="post"
          >
            <div class="form-floating">
              <input
                type="text"
                class="form-control"
                id="fullName"
                th:field="*{fullName}"
                placeholder="Full Name"
                required
              />
              <label for="fullName"
                ><i class="bi bi-person me-2"></i>Full Name</label
              >
            </div>

            <div class="form-floating">
              <input
                type="email"
                class="form-control"
                id="email"
                th:field="*{email}"
                placeholder="Email"
                required
              />
              <label for="email"
                ><i class="bi bi-envelope me-2"></i>Email address</label
              >
            </div>

            <div class="form-floating">
              <input
                type="password"
                class="form-control"
                id="password"
                th:field="*{password}"
                placeholder="Password"
                required
                minlength="6"
              />
              <label for="password"
                ><i class="bi bi-lock me-2"></i>Password</label
              >
              <div class="password-strength">
                <div class="password-strength-bar" id="strengthBar"></div>
              </div>
              <small class="text-muted">At least 6 characters</small>
            </div>

            <div class="form-floating">
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                th:field="*{confirmPassword}"
                placeholder="Confirm Password"
                required
              />
              <label for="confirmPassword"
                ><i class="bi bi-check-circle me-2"></i>Confirm Password</label
              >
            </div>

            <button type="submit" class="btn btn-register">
              <i class="bi bi-person-plus me-2"></i>Register
            </button>
          </form>

          <div class="divider">
            <span>or</span>
          </div>

          <div class="login-link">
            <p class="mb-0">
              Already have an account?
              <a th:href="@{/login}">Sign in</a>
            </p>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="text-white text-decoration-none">
          <i class="bi bi-arrow-left me-2"></i>Back to Home
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("password")
        .addEventListener("input", function () {
          const password = this.value;
          const strengthBar = document.getElementById("strengthBar");
          let strength = 0;

          if (password.length >= 6) strength += 25;
          if (password.length >= 8) strength += 25;
          if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
          if (/[0-9]/.test(password)) strength += 25;

          strengthBar.style.width = strength + "%";

          if (strength <= 25) {
            strengthBar.style.background = "#dc3545";
          } else if (strength <= 50) {
            strengthBar.style.background = "#ffc107";
          } else if (strength <= 75) {
            strengthBar.style.background = "#17a2b8";
          } else {
            strengthBar.style.background = "#28a745";
          }
        });
    </script>
  </body>
</html>
