<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>

        body{
            font-family: Arial;
            background: linear-gradient(135deg,#6a82fb,#8f5db7);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            width:350px;
            background:white;
            padding:40px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#6a82fb;
            border:none;
            color:white;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Reset Password</h2>

    <form action="/forgot-password" method="post">

        <input type="email" name="email" placeholder="Email">

        <input type="password" name="newPassword" placeholder="New Password">

        <button type="submit">Reset Password</button>

    </form>

</div>

</body>
</html>
