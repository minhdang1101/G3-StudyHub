<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - StudyHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
      }

      .forgot-container {
        width: 100%;
        max-width: 420px;
      }

      .forgot-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .forgot-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .forgot-header h2 {
        margin: 0;
        font-weight: 700;
        font-size: 1.8rem;
      }

      .forgot-header p {
        margin: 10px 0 0 0;
        opacity: 0.9;
      }

      .forgot-body {
        padding: 40px 30px;
      }

      .form-floating {
        margin-bottom: 20px;
      }

      .form-floating .form-control {
        border-radius: 12px;
        border: 2px solid #e9ecef;
        height: 56px;
      }

      .form-floating .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      .btn-reset {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 1.1rem;
        font-weight: 600;
        width: 100%;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-reset:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
      }

      .back-link a:hover {
        color: #764ba2;
        text-decoration: underline;
      }

      .alert {
        border-radius: 12px;
        border: none;
      }

      .brand-logo {
        font-size: 3rem;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="forgot-container">
      <div class="forgot-card">
        <div class="forgot-header">
          <div class="brand-logo"><i class="bi bi-key"></i></div>
          <h2>Forgot Password?</h2>
          <p>Enter your email to reset your password</p>
        </div>

        <div class="forgot-body">
          <form action="/forgot-password" method="post">
            <div class="form-floating">
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
              />
              <label for="email"
                ><i class="bi bi-envelope me-2"></i>Email address</label
              >
            </div>

            <div class="form-floating">
              <input
                type="password"
                class="form-control"
                id="newPassword"
                name="newPassword"
                placeholder="New Password"
                required
                minlength="6"
              />
              <label for="newPassword"
                ><i class="bi bi-lock me-2"></i>New Password</label
              >
            </div>

            <button type="submit" class="btn btn-reset">
              <i class="bi bi-arrow-clockwise me-2"></i>Reset Password
            </button>
          </form>

          <div class="back-link">
            <a href="/login">
              <i class="bi bi-arrow-left me-1"></i>Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
