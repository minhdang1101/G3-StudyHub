<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .top-navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            background-color: white;
        }
        .stat-card {
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{common/sidebar :: sidebar(activePage='dashboard')}"></div>

    <div class="flex-grow-1 d-flex flex-column" style="height: 100vh; overflow-y: auto;">

        <nav class="navbar navbar-expand-lg top-navbar px-4 py-3">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary d-md-none me-3">
                    <i class="bi bi-list"></i>
                </button>

                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-bold">
                        <li class="nav-item"><a class="nav-link active" th:href="@{/static}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Blogs</a></li>
                    </ul>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <div class="text-end d-none d-sm-block">
                        <div class="fw-bold">Admin User</div>
                        <small class="text-muted">Super Admin</small>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff"
                         class="rounded-circle border" width="45" height="45" alt="Avatar">
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <h3 class="mb-4 text-dark">System Overview</h3>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm stat-card bg-primary text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">Total Users</h6>
                                    <h2 class="display-6 fw-bold">128</h2>
                                </div>
                                <i class="bi bi-people-fill fs-1 opacity-50"></i>
                            </div>
                            <hr class="border-white opacity-25">
                            <a th:href="@{/users}" class="text-white text-decoration-none small">
                                View Details <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm stat-card bg-success text-white h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">System Settings</h6>
                                    <h2 class="display-6 fw-bold">15</h2>
                                </div>
                                <i class="bi bi-gear-fill fs-1 opacity-50"></i>
                            </div>
                            <hr class="border-white opacity-25">
                            <a th:href="@{/settings}" class="text-white text-decoration-none small">
                                Configure <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm stat-card bg-warning text-dark h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">Pending Requests</h6>
                                    <h2 class="display-6 fw-bold">4</h2>
                                </div>
                                <i class="bi bi-exclamation-triangle-fill fs-1 opacity-50"></i>
                            </div>
                            <hr class="border-dark opacity-25">
                            <a href="#" class="text-dark text-decoration-none small">
                                Process Now <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4 border-0 shadow-sm" style="min-height: 400px;">
                <div class="card-body d-flex align-items-center justify-content-center text-muted">
                    <div class="text-center">
                        <i class="bi bi-layout-text-window-reverse display-1 text-secondary opacity-25"></i>
                        <p class="mt-3">Welcome to the System Administration Dashboard</p>
                    </div>
                </div>
            </div>

            <footer class="mt-4 text-center text-muted small">
                &copy; 2026 Admin System Management. All rights reserved.
            </footer>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
