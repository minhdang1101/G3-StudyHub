<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Permission Management</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:40px;
        }

        h2{
            text-align:center;
            margin-bottom:30px;
        }

        .container{
            width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table th, table td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        table th{
            background:#2c3e50;
            color:white;
        }

        button{
            padding:8px 14px;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }

        .btn-add{
            background:#27ae60;
            color:white;
        }

        .btn-delete{
            background:#e74c3c;
            color:white;
        }

        .form-box{
            margin-top:20px;
        }

        select{
            padding:6px;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Permission Management</h2>

    <!-- Form thêm permission -->

    <div class="form-box">

        <form th:action="@{/permissions/save}" method="post">

            <label>Role:</label>

            <select name="roleId">

                <option th:each="r : ${roles}"
                        th:value="${r.settingId}"
                        th:text="${r.name}">
                </option>

            </select>


            <label>Page:</label>

            <select name="pageId">

                <option th:each="p : ${pages}"
                        th:value="${p.settingId}"
                        th:text="${p.name}">
                </option>

            </select>

            <label>
                <input type="checkbox" name="canRead"> Read
            </label>

            <label>
                <input type="checkbox" name="canAdd"> Add
            </label>

            <label>
                <input type="checkbox" name="canEdit"> Edit
            </label>

            <label>
                <input type="checkbox" name="canDelete"> Delete
            </label>

            <button class="btn-add" type="submit">
                Save Permission
            </button>

        </form>

    </div>


    <!-- Table permission -->

    <table>

        <thead>

        <tr>
            <th>Role ID</th>
            <th>Page ID</th>
            <th>Read</th>
            <th>Add</th>
            <th>Edit</th>
            <th>Delete</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="p : ${permissions}">

            <td th:text="${p.id.roleId}"></td>

            <td th:text="${p.id.pageId}"></td>

            <td th:text="${p.canRead}"></td>

            <td th:text="${p.canAdd}"></td>

            <td th:text="${p.canEdit}"></td>

            <td th:text="${p.canDelete}"></td>

            <td>

                <a th:href="@{/permissions/delete(roleId=${p.id.roleId},pageId=${p.id.pageId})}">
                    <button class="btn-delete">Delete</button>
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
