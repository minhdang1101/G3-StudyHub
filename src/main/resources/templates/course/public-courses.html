<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Public Courses</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 1200px;
            margin: auto;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .price {
            color: red;
            font-weight: bold;
        }

        .btn {
            display: block;
            background: #007bff;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="container">
        <form th:action="@{/courses}" method="get" onsubmit="return validateSearch()">

            <div style="display:flex; gap:10px; margin-bottom:20px;">

                <input type="text" id="searchInput" name="keyword" placeholder="Search courses..." th:value="${keyword}"
                    style="flex:1; padding:10px; border:1px solid #ccc; border-radius:4px;">

                <button type="submit" style="padding:10px 15px; background:#007bff; color:white; border:none;">
                    🔍
                </button>

                <select name="categoryId" onchange="this.form.submit()" style="padding:10px; border:1px solid #ccc;">

                    <option value="">All Categories</option>
                    <option value="1">Programming</option>
                    <option value="2">Business</option>
                    <option value="3">Marketing</option>

                </select>

            </div>

        </form>



        <div class="course-grid">

            <div class="card" th:each="course : ${courses}">
                <img th:src="${course.thumbnailUrl}">

                <div class="card-body">
                    <h4 th:text="${course.title}"></h4>
                    <p th:text="${course.description}"></p>

                    <p>
                        <span style="text-decoration:line-through" th:text="${course.price}"></span>
                        <span class="price" th:text="${course.price}"></span>
                    </p>

                    <a class="btn" th:href="@{/enroll/{id}(id=${course.courseId})}">
                        + Enroll Now
                    </a>

                </div>
            </div>

        </div>

    </div>

</body>

</html>

<script>

    function validateSearch() {

        let input = document.getElementById("searchInput");

        if (input.value.trim() === "") {
            alert("Vui lòng nhập từ cần tìm vào");
            input.focus();
            return false;
        }

        return true;
    }

</script>
