<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chapter Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/sidebar :: sidebar(activePage='courses')}"></div>

    <div class="container-fluid p-4">
        <h2 class="mb-4" th:text="${chapterDto.chapterId != null ? 'Edit Chapter' : 'New Chapter'}"></h2>

        <div th:if="${message}" class="alert" th:classappend="' alert-' + ${alertType}" th:text="${message}"></div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/courses/chapter/save}" th:object="${chapterDto}" method="post">
                    <input type="hidden" th:field="*{chapterId}">
                    <input type="hidden" th:field="*{courseId}">

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" class="form-control" th:value="${course.title}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" th:field="*{title}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" rows="4" class="form-control"></textarea>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Order Index</label>
                            <input type="number" th:field="*{orderIndex}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('orderIndex')}" th:errors="*{orderIndex}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{'/courses/content/' + ${course.courseId}}" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
