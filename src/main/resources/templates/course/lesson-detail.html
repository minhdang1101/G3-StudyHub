<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/sidebar :: sidebar(activePage='courses')}"></div>

    <div class="container-fluid p-4">
        <h2 class="mb-4" th:text="${lessonDto.lessonId != null ? 'Edit Lesson' : 'New Lesson'}"></h2>

        <div th:if="${message}" class="alert" th:classappend="' alert-' + ${alertType}" th:text="${message}"></div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/courses/lesson/save}" th:object="${lessonDto}" method="post">
                    <input type="hidden" th:field="*{lessonId}">
                    <input type="hidden" th:field="*{chapterId}">

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" class="form-control" th:value="${course.title}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Chapter</label>
                        <input type="text" class="form-control" th:value="${chapter.title}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" th:field="*{title}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Content Type</label>
                            <select th:field="*{contentType}" class="form-select">
                                <option value="">-- Select type --</option>
                                <option value="VIDEO">VIDEO</option>
                                <option value="DOCUMENT">DOCUMENT</option>
                                <option value="QUIZ">QUIZ</option>
                                <option value="LINK">LINK</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('contentType')}" th:errors="*{contentType}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Duration (minutes)</label>
                            <input type="number" th:field="*{durationMinutes}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Order Index</label>
                            <input type="number" th:field="*{orderIndex}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('orderIndex')}" th:errors="*{orderIndex}"></div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Content URL</label>
                        <input type="text" th:field="*{contentUrl}" class="form-control">
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-3">
                            <label class="form-label">Preview</label>
                            <select th:field="*{isPreview}" class="form-select">
                                <option th:value="true">Yes</option>
                                <option th:value="false">No</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('isPreview')}" th:errors="*{isPreview}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{'/courses/content/' + ${course.courseId}}" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
