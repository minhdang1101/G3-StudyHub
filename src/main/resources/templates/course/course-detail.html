<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{common/sidebar :: sidebar(activePage='courses')}"></div>

    <div class="container-fluid p-4">
        <h2 class="mb-4" th:text="${courseDto.courseId != null ? 'Edit Course' : 'New Course'}"></h2>

        <div th:if="${message}" class="alert" th:classappend="' alert-' + ${alertType}" th:text="${message}"></div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/courses/save}" th:object="${courseDto}" method="post">
                    <input type="hidden" th:field="*{courseId}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Title</label>
                            <input type="text" th:field="*{title}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Category</label>
                            <select th:field="*{categoryId}" class="form-select">
                                <option value="">-- Select category --</option>
                                <option th:each="c : ${categoryList}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Level</label>
                            <select th:field="*{levelId}" class="form-select">
                                <option value="">-- Select level --</option>
                                <option th:each="l : ${levelList}" th:value="${l.id}" th:text="${l.name}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('levelId')}" th:errors="*{levelId}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Instructor</label>
                            <select th:field="*{instructorId}" class="form-select">
                                <option value="">-- Select instructor --</option>
                                <option th:each="i : ${instructorList}" th:value="${i.id}" th:text="${i.fullName}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('instructorId')}" th:errors="*{instructorId}"></div>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Duration (hours)</label>
                            <input type="number" th:field="*{durationHours}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('durationHours')}" th:errors="*{durationHours}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Thumbnail URL</label>
                            <input type="text" th:field="*{thumbnailUrl}" class="form-control">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" rows="5" class="form-control"></textarea>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/courses}" class="btn btn-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
