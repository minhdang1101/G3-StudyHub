<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id == null} ? 'Course Detail' : 'Edit Course'">Course Detail</title>

    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --secondary: #6c757d;
            --border: #dee2e6;
            --text: #212529;
            --muted: #6c757d;
            --shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: var(--text);
        }

        .container {
            border: 2px solid #2b6fe2;
            padding: 12px;
            min-height: calc(100vh - 20px);
            background: #fff;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: var(--secondary);
            color: #fff;
        }

        .btn-light {
            background: #f8f9fa;
            border-color: var(--border);
            color: #495057;
        }

        .card {
            border: 1px solid var(--border);
            background: #fff;
        }

        .card-body {
            padding: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 18px 34px;
            align-items: start;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 44px;
        }

        label {
            display: inline-block;
            margin-bottom: 6px;
            font-size: 15px;
            color: #444;
        }

        .required::after {
            content: "*";
            color: #444;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            border: 1px solid #b7b7b7;
            border-radius: 3px;
            font-size: 15px;
            padding: 10px 12px;
            outline: none;
            background: #fff;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
        }

        .thumbnail-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }

        .thumb-large {
            width: 265px;
            height: 160px;
            border: 1px solid var(--border);
            background: #f8f9fa;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-placeholder {
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
            font-size: 15px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px;
            border: 1px solid var(--border);
            border-bottom: none;
            background: #f8f9fa;
            border-radius: 3px 3px 0 0;
        }

        .tool-btn {
            min-width: 34px;
            height: 30px;
            border: 1px solid #cfcfcf;
            background: #fff;
            border-radius: 2px;
            font-size: 16px;
            font-weight: 700;
            color: #333;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
        }

        .editor textarea {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            background: #fcfcfc;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .error-text {
            color: red;
            font-size: 13px;
            margin-top: 4px;
        }

        @media (max-width: 1100px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .row-2,
            .checkbox-grid {
                grid-template-columns: 1fr;
            }

            .thumb-large {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1 th:text="${course.id == null} ? 'Course Details' : 'Edit Course'">Course Details</h1>
        <div class="btn-group">
            <a th:href="@{/courses}" class="btn btn-secondary">← Back to Courses</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/courses/save}" th:object="${course}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{courseId}"/>

                <div class="form-grid">
                    <div class="full-width">
                        <label for="title" class="required">Title</label>
                        <input type="text" id="title" th:field="*{title}">
                        <div class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div>
                        <div class="row-2">
                            <div>
                                <label for="category">Category</label>
                                <select id="category" th:field="*{category}">
                                    <option value="Programming">Lập trình</option>
                                    <option value="Business">Business</option>
                                    <option value="Data Science">Data Science</option>
                                </select>
                            </div>

                            <div>
                                <label for="manager">Manager</label>
                                <select id="manager" th:field="*{instructor}">
                                    <option value="Administrator">Administrator</option>
                                    <option value="Manager Name">Manager Name</option>
                                </select>
                            </div>

                            <div>
                                <label for="level">Level</label>
                                <select id="level" th:field="*{level}">
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate">Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>

                            <div>
                                <label for="duration" class="required">Duration</label>
                                <input type="text" id="duration" th:field="*{durationHours}" placeholder="Ví dụ: 8 giờ">
                                <div class="error-text" th:if="${#fields.hasErrors('duration')}" th:errors="*{durationHours}"></div>
                            </div>

                            <div>
                                <label for="listedPrice" class="required">Listed Price</label>
                                <input type="number" id="listedPrice" th:field="*{price}" min="0" step="0.01">
                                <div class="error-text" th:if="${#fields.hasErrors('listedPrice')}" th:errors="*{price}"></div>
                            </div>

                            <div>
                                <label for="salePrice">Sale Price</label>
                                <input type="number" id="salePrice" th:field="*{price}" min="0" step="0.01">
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="thumbnail-box">
                            <label for="thumbnailFile">Thumbnail</label>

                            <div class="thumb-large">
                                <img th:if="${course.thumbnail != null and !#strings.isEmpty(course.thumbnail)}"
                                     th:src="@{${course.thumbnail}}"
                                     alt="Thumbnail">
                                <div class="thumbnail-placeholder"
                                     th:if="${course.thumbnail == null or #strings.isEmpty(course.thumbnail)}">
                                    No image selected
                                </div>
                            </div>

                            <input type="file" id="thumbnailFile" name="thumbnailFile" accept="image/*">
                            <div class="hint">Chọn ảnh từ máy để tải lên. Không có preview phía client vì đã bỏ JavaScript.</div>
                        </div>
                    </div>

                    <div>
                        <label style="display:block; margin-bottom:12px;">Status</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-row">
                                <input type="checkbox" th:field="*{status}">
                                Published
                            </label>
                            <label class="checkbox-row">
                                <input type="checkbox" >
                                Featured Post
                            </label>
                        </div>
                    </div>

                    <div class="full-width editor">
                        <label for="description">Description</label>
                        <div class="toolbar">
                            <span class="tool-btn">B</span>
                            <span class="tool-btn"><i>I</i></span>
                            <span class="tool-btn"><u>U</u></span>
                            <span class="tool-btn">S̶</span>
                            <span class="tool-btn">▣</span>
                            <span class="tool-btn">≣</span>
                            <span class="tool-btn">≡</span>
                            <span class="tool-btn">☰</span>
                            <span class="tool-btn">▦</span>
                            <span class="tool-btn">🔗</span>
                            <span class="tool-btn">🖼</span>
                            <span class="tool-btn">⤢</span>
                            <span class="tool-btn">&lt;/&gt;</span>
                            <span class="tool-btn">?</span>
                        </div>
                        <textarea id="description" th:field="*{description}"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit"
                            class="btn btn-light"
                            th:text="${course.id == null} ? 'Submit' : 'Update Course'">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
