<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - StudyHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .login-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .login-header h2 {
        margin: 0;
        font-weight: 700;
        font-size: 2rem;
      }

      .login-header p {
        margin: 10px 0 0 0;
        opacity: 0.9;
      }

      .login-body {
        padding: 40px 30px;
      }

      .form-floating {
        margin-bottom: 20px;
      }

      .form-floating .form-control {
        border-radius: 12px;
        border: 2px solid #e9ecef;
        height: 56px;
      }

      .form-floating .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 1.1rem;
        font-weight: 600;
        width: 100%;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .divider {
        text-align: center;
        margin: 25px 0;
        position: relative;
      }

      .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #e9ecef;
      }

      .divider span {
        background: white;
        padding: 0 15px;
        position: relative;
        color: #6c757d;
        font-size: 0.9rem;
      }

      .login-links {
        text-align: center;
      }

      .login-links a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
      }

      .login-links a:hover {
        color: #764ba2;
        text-decoration: underline;
      }

      .alert {
        border-radius: 12px;
        border: none;
      }

      .brand-logo {
        font-size: 3rem;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="brand-logo"><i class="bi bi-book-half"></i></div>
          <h2>Welcome Back!</h2>
          <p>Sign in to continue your learning journey</p>
        </div>

        <div class="login-body">
          <!-- Error Message -->
          <div
            th:if="${error}"
            class="alert alert-danger d-flex align-items-center"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Invalid email or password</span>
          </div>

          <!-- Success Message -->
          <div
            th:if="${param.reset}"
            class="alert alert-success d-flex align-items-center"
            role="alert"
          >
            <i class="bi bi-check-circle-fill me-2"></i>
            <span>Password reset successfully!</span>
          </div>

          <form th:action="@{/login}" method="post">
            <div class="form-floating">
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
              />
              <label for="email"
                ><i class="bi bi-envelope me-2"></i>Email address</label
              >
            </div>

            <div class="form-floating">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                required
              />
              <label for="password"
                ><i class="bi bi-lock me-2"></i>Password</label
              >
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" />
                <label class="form-check-label" for="remember"
                  >Remember me</label
                >
              </div>
              <a th:href="@{/forgot-password}" class="text-decoration-none"
                >Forgot password?</a
              >
            </div>

            <button type="submit" class="btn btn-login">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <div class="divider">
            <span>or</span>
          </div>

          <div class="login-links">
            <p class="mb-0">
              Don't have an account?
              <a th:href="@{/users/register}">Create account</a>
            </p>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="text-white text-decoration-none">
          <i class="bi bi-arrow-left me-2"></i>Back to Home
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
