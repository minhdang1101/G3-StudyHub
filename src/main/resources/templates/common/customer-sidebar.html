<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="customer-sidebar(activePage)" class="sidebar-wrapper">

        <div class="sidebar-brand">
            <a th:href="@{/}" class="d-flex align-items-center text-white text-decoration-none">
                <span class="brand-icon">📚</span>
                <span class="brand-text">StudyHub</span>
            </a>
        </div>

        <div class="sidebar-nav">
            <ul class="nav flex-column">

                <li class="nav-section">Browse</li>

                <li class="nav-item">
                    <a th:href="@{/courses}" class="nav-link"
                        th:classappend="${activePage == 'browse-courses'} ? 'active' : ''">
                        <i class="bi bi-compass"></i>
                        <span>Browse Courses</span>
                    </a>
                </li>

                <li class="nav-section">My Learning</li>

                <li class="nav-item">
                    <a th:href="@{/my-enrollments}" class="nav-link"
                        th:classappend="${activePage == 'my-enrollments'} ? 'active' : ''">
                        <i class="bi bi-journal-bookmark"></i>
                        <span>My Enrollments</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/my-courses}" class="nav-link"
                        th:classappend="${activePage == 'my-courses'} ? 'active' : ''">
                        <i class="bi bi-mortarboard"></i>
                        <span>My Courses</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/my-progress}" class="nav-link"
                        th:classappend="${activePage == 'my-progress'} ? 'active' : ''">
                        <i class="bi bi-graph-up-arrow"></i>
                        <span>Study Progress</span>
                    </a>
                </li>

                <li class="nav-section">Account</li>

                <li class="nav-item">
                    <a th:href="@{/profile}" class="nav-link"
                        th:classappend="${activePage == 'profile'} ? 'active' : ''">
                        <i class="bi bi-person-circle"></i>
                        <span>My Profile</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/change-password}" class="nav-link"
                        th:classappend="${activePage == 'change-password'} ? 'active' : ''">
                        <i class="bi bi-shield-lock"></i>
                        <span>Change Password</span>
                    </a>
                </li>

            </ul>
        </div>

        <div class="sidebar-footer">
            <div class="dropdown">
                <a href="#" class="user-dropdown dropdown-toggle" id="dropdownCustomer" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <img th:src="${session.user != null && session.user.avatar != null ? session.user.avatar : 'https://ui-avatars.com/api/?name=User&background=6366f1&color=fff&bold=true'}"
                        width="36" height="36" class="user-avatar" alt="Avatar">
                    <div class="user-info">
                        <span class="user-name"
                            th:text="${session.user != null ? session.user.fullName : 'Guest'}">User</span>
                        <span class="user-role">Member</span>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropdownCustomer">
                    <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" th:href="@{/logout}"><i
                                class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </div>
        </div>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

            .sidebar-wrapper {
                display: flex;
                flex-direction: column;
                width: 260px;
                min-height: 100vh;
                background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #3730a3 100%);
                font-family: 'Plus Jakarta Sans', sans-serif;
                padding: 0;
                position: relative;
                overflow: hidden;
            }

            .sidebar-wrapper::before {
                content: '';
                position: absolute;
                top: -50%;
                right: -50%;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
                pointer-events: none;
            }

            .sidebar-brand {
                padding: 1.5rem 1.25rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .brand-icon {
                font-size: 1.5rem;
                margin-right: 0.6rem;
            }

            .brand-text {
                font-size: 1.3rem;
                font-weight: 800;
                letter-spacing: -0.5px;
                background: linear-gradient(135deg, #fff 0%, #c7d2fe 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .sidebar-nav {
                flex: 1;
                padding: 0.75rem 0.75rem;
                overflow-y: auto;
            }

            .sidebar-nav .nav {
                gap: 2px;
            }

            .nav-section {
                list-style: none;
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                color: rgba(199, 210, 254, 0.5);
                padding: 1.2rem 0.75rem 0.5rem;
            }

            .nav-item .nav-link {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.65rem 0.75rem;
                border-radius: 10px;
                color: rgba(224, 231, 255, 0.75);
                font-size: 0.875rem;
                font-weight: 500;
                text-decoration: none;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
            }

            .nav-item .nav-link i {
                font-size: 1.1rem;
                width: 20px;
                text-align: center;
                transition: transform 0.2s ease;
            }

            .nav-item .nav-link:hover {
                background: rgba(99, 102, 241, 0.2);
                color: #fff;
                transform: translateX(4px);
            }

            .nav-item .nav-link:hover i {
                transform: scale(1.15);
            }

            .nav-item .nav-link.active {
                background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
                color: #fff;
                font-weight: 600;
                box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            }

            .nav-item .nav-link.active i {
                color: #fff;
            }

            .sidebar-footer {
                padding: 1rem 0.75rem;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }

            .user-dropdown {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                text-decoration: none;
                color: rgba(224, 231, 255, 0.85);
                padding: 0.5rem;
                border-radius: 10px;
                transition: background 0.2s ease;
            }

            .user-dropdown:hover {
                background: rgba(99, 102, 241, 0.15);
                color: #fff;
            }

            .user-dropdown::after {
                margin-left: auto;
            }

            .user-avatar {
                border-radius: 10px;
                border: 2px solid rgba(99, 102, 241, 0.5);
            }

            .user-info {
                display: flex;
                flex-direction: column;
                line-height: 1.2;
            }

            .user-name {
                font-size: 0.85rem;
                font-weight: 600;
                color: #fff;
            }

            .user-role {
                font-size: 0.7rem;
                color: rgba(199, 210, 254, 0.6);
            }
        </style>

    </div>

</body>

</html>
