<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${setting.id == null ? 'Add New Setting' : 'Edit Setting'}">Setting Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

<div class="d-flex">
  <div th:replace="~{common/sidebar :: sidebar(activePage='settings')}"></div>

  <div class="container-fluid p-4 bg-light" style="min-height: 100vh;">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">

      <h2 class="mb-4 text-primary"
          th:text="${setting.id == null ? 'Add New Setting' : 'Setting Details'}">
        Header Title
      </h2>

      <form th:action="@{/settings/save}" method="post" th:object="${setting}" class="row g-3">

        <input type="hidden" th:field="*{id}">

        <div class="col-md-6">
          <label class="form-label fw-bold">Group (Setting Type) <span class="text-danger">*</span></label>

          <select class="form-select" th:field="*{typeId}"
                  th:classappend="${#fields.hasErrors('typeId')} ? 'is-invalid' : ''">

            <option th:each="type : ${typeList}"
                    th:value="${type.id}"
                    th:text="${type.name}"></option>
          </select>

          <div class="invalid-feedback" th:if="${#fields.hasErrors('typeId')}" th:errors="*{typeId}"></div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Order Index <span class="text-danger">*</span></label>

          <input type="number" class="form-control" th:field="*{orderIndex}" min="1"
                 th:classappend="${#fields.hasErrors('orderIndex')} ? 'is-invalid' : ''">

          <div class="invalid-feedback" th:if="${#fields.hasErrors('orderIndex')}">
            <i class="bi bi-exclamation-circle"></i> <span th:errors="*{orderIndex}"></span>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" th:field="*{name}"
                 placeholder="e.g., User Role"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Value</label>
          <input type="text" class="form-control" th:field="*{value}" placeholder="e.g., ROLE_ADMIN">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold d-block">Status</label>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" th:field="*{status}" id="active" value="Active">
            <label class="form-check-label" for="active">Active</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" th:field="*{status}" id="inactive" value="Inactive">
            <label class="form-check-label" for="inactive">Inactive</label>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
        </div>

        <div class="col-12 mt-4 d-flex justify-content-between">
          <a th:href="@{/settings}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to List
          </a>
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-save"></i> Submit
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
